<!-- 正方形 viewBox + 四周留白是刻意的（见 _icons.scss 的 .icon 与 _menu.scss 的 .upload-button）：
     这张图要当 CSS mask 用，mask-size: contain 会把素材按自身长宽比塞进图标的方盒子。
     原稿是 38×37（圆盘正好切着 viewBox 的上下边、右边只留 0.05），塞进方盒子后要靠
     缩放 + 留白取整，收起/展开两次绘制会差出 1px 上下的长宽，而且贴边处会被 mask 边界
     切出一条短直边。改成 40×40、圆盘四周各留 1.5 之后 contain 就是 1:1，不再有取整失真。
     ⚠️ 别为了「填满」把 viewBox 收紧回 37×37 或去掉留白，那会把上面两个症状一起带回来。 -->
